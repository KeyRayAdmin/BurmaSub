<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StreamHub — Free Movies & Series</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>StreamHub</h1>
    <nav>
      <a href="#movies" class="tab active" data-tab="movies">Movies</a>
      <a href="#series" class="tab" data-tab="series">Series</a>
    </nav>
  </header>

  <!-- 🔶 Banner Ad Placeholder -->
  <div class="banner-ad">
    <!-- Ad space: 728×90 or responsive -->
    <div class="ad-placeholder">[ Banner Ad Here ]</div>
  </div>

  <main class="content">
    <!-- Movies Section -->
    <section id="movies" class="tab-content active">
      <h2>Movies</h2>
      <div class="grid">
        <a href="detail.html?id=1" class="card">
          <img src="https://image.tmdb.org/t/p/original/xlaY2zyzMfkhk0HSC5VUwzoZPU1.jpg" alt="Movie Poster" loading="lazy" />
          <h3>Inception</h3>
          <span class="meta">2010 • Sci-Fi</span>
        </a>
        <a href="detail.html?id=2" class="card">
          <img src="https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" alt="Movie Poster" loading="lazy" />
          <h3>Interstellar</h3>
          <span class="meta">2014 • Adventure</span>
        </a>
        <!-- Add more as needed -->
      </div>
    </section>

    <!-- Series Section (hidden by default) -->
    <section id="series" class="tab-content">
      <h2>Series</h2>
      <div class="grid">
        <a href="detail.html?id=101" class="card">
          <img src="https://via.placeholder.com/185x278/0f172a/d1d5db?text=Poster" alt="Series Poster" loading="lazy" />
          <h3>Stranger Things</h3>
          <span class="meta">2016–2022 • Sci-Fi</span>
        </a>
        <a href="detail.html?id=102" class="card">
          <img src="https://via.placeholder.com/185x278/0f172a/d1d5db?text=Poster" alt="Series Poster" loading="lazy" />
          <h3>The Mandalorian</h3>
          <span class="meta">2019– • Action</span>
        </a>
      </div>
    </section>
  </main>

  <footer class="footer">
    &copy; 2025 StreamHub. For educational/demo use only.
  </footer>

  <script src="script.js"></script>
</body>
  </html>
